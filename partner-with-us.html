<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partner With Us | Workforce 2030</title>
    <link rel="icon" type="image/png" href="./images/Workforce-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alata&family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="workforce-page">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg navbar-light nav-animate">
        <div class="container">
          <a
            class="navbar-brand"
            href="./index.html"
            aria-label="Workforce 2030 home"
          >
            <img
              src="./images/Workforce-logo.png"
              alt="Workforce 2030"
              class="navbar-logo"
            />
            <span class="navbar-logo-divider" aria-hidden="true"></span>
            <img src="./images/Zenith Nexus Logo.png" alt="Zenith Nexus" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
              <li class="nav-item">
                <a class="nav-link" href="./index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./insight.html">Insight</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./about-us.html">About Us</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="workforce-page-content" style="margin-top: 60px;" id="partnership-contact">
        <div class="container workforce-page-container">
          <div class="partner-request-form">
            <form id="partnerRequestForm" class="invitation-form">
              <div class="partner-request-header">
                <span class="invitation-modal-kicker">WORKFORCE 2030</span>
                <h2>PARTNER WITH US</h2>
                <span class="invitation-title-rule" aria-hidden="true"></span>
                <p>
                  Share a few details about your organisation and the
                  partnership you have in mind.
                </p>
              </div>
              <div class="invitation-form-grid">
                <div class="invitation-form-field">
                  <label for="requestFirstName">First Name*</label>
                  <input
                    id="requestFirstName"
                    name="firstName"
                    autocomplete="given-name"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestLastName">Last Name*</label>
                  <input
                    id="requestLastName"
                    name="lastName"
                    autocomplete="family-name"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestEmail">Business Email*</label>
                  <input
                    id="requestEmail"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestMobile">Mobile Number*</label>
                  <input
                    id="requestMobile"
                    name="mobile"
                    type="tel"
                    autocomplete="tel"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestJobTitle">Job Title*</label>
                  <input
                    id="requestJobTitle"
                    name="jobTitle"
                    autocomplete="organization-title"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestCompany">Company / Organisation*</label>
                  <input
                    id="requestCompany"
                    name="company"
                    autocomplete="organization"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestCountry">Country*</label>
                  <input
                    id="requestCountry"
                    name="country"
                    autocomplete="country-name"
                    required
                  />
                </div>
                <div class="invitation-form-field">
                  <label for="requestOrganisationType"
                    >Organisation Type*</label
                  >
                  <select
                    id="requestOrganisationType"
                    name="organisationType"
                    required
                  >
                    <option value="" selected disabled>Select</option>
                    <option value="enterprise">Enterprise</option>
                    <option value="government">Government</option>
                    <option value="technology-provider">
                      Technology Provider
                    </option>
                    <option value="consulting">Consulting / Advisory</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="invitation-form-field">
                  <label for="requestPartnershipType">Partner With Us*</label>
                  <select
                    id="requestPartnershipType"
                    name="partnershipType"
                    required
                  >
                    <option value="" selected disabled>Select</option>
                    <option value="showcase-solution">
                      Sponsor
                    </option>
                    <option value="contribute-dialogue">
                      Exhibitor
                    </option>
                    <option value="connect-leaders">
                      Media Partner
                    </option>
                    <option value="connect-leaders">
                      Knowledge Partner
                    </option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>
              <div class="invitation-form-field invitation-message-field">
                <label for="requestMessage">Message / Area of Interest</label>
                <textarea
                  id="requestMessage"
                  name="message"
                  rows="3"
                  placeholder="Tell us about your partnership objectives or any questions."
                ></textarea>
              </div>
              <label class="invitation-consent" for="requestConsent">
                <input
                  id="requestConsent"
                  name="consent"
                  type="checkbox"
                  required
                />
                <span>
                  I agree to be contacted by Zenith Nexus regarding Workforce
                  2030.
                </span>
              </label>
              <p
                class="invitation-form-status"
                id="partnerRequestStatus"
                role="status"
                aria-live="polite"
                hidden
              ></p>
              <button class="invitation-submit-btn" type="submit">
                SUBMIT PARTNERSHIP REQUEST
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
              </button>
              <p class="invitation-form-note">
                This form is not connected to a submission service yet.
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("partnerRequestForm")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          const status = document.getElementById("partnerRequestStatus");
          status.textContent =
            "Partnership requests are not connected to a submission service yet.";
          status.hidden = false;
        });
    </script>
  </body>
</html>
