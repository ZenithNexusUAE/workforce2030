<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request an Invitation | Workforce 2030</title>
    <link rel="icon" type="image/png" href="./images/Workforce-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alata&family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="workforce-page">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg navbar-light nav-animate">
        <div class="container">
          <a
            class="navbar-brand"
            href="./index.html"
            aria-label="Workforce 2030 home"
          >
            <img
              src="./images/Workforce-logo.png"
              alt="Workforce 2030"
              class="navbar-logo"
            />
            <span class="navbar-logo-divider" aria-hidden="true"></span>
            <img src="./images/Zenith Nexus Logo.png" alt="Zenith Nexus" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
              <li class="nav-item">
                <a class="nav-link" href="./index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./insight.html">Insights</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./about-us.html">About Us</a>
              </li>
            </ul>
            <nav class="hero-social-links" aria-label="Social media">
              <!-- <a href="#" aria-label="Instagram">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i>
              </a> -->
              <a
                href="https://www.linkedin.com/company/zenithnexus/?viewAsMember=true"
                aria-label="LinkedIn"
              >
                <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
              </a>
            </nav>
          </div>
        </div>
      </nav>
    </header>
    <main class="invitation-page">
      <section class="workforce-page-content" id="invitation-form">
        <div class="container workforce-page-container">
          <form id="invitationPageForm" class="invitation-page-form">
            <div class="invitation-page-form-header">
              <span class="invitation-modal-kicker">
                WORKFORCE 2030 · DUBAI, UAE · JANUARY 2027
              </span>
              <h1>REQUEST INVITATION</h1>
              <span class="invitation-title-rule" aria-hidden="true"></span>
              <p>
                Submit your details for invitation consideration to Workforce
                2030, an executive forum on AI-augmented enterprises.
              </p>
            </div>
            <div class="invitation-form-grid">
              <div class="invitation-form-field">
                <label for="pageFirstName">First Name*</label
                ><input
                  id="pageFirstName"
                  name="firstName"
                  autocomplete="given-name"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageLastName">Last Name*</label
                ><input
                  id="pageLastName"
                  name="lastName"
                  autocomplete="family-name"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageEmail">Business Email*</label
                ><input
                  id="pageEmail"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageMobile">Mobile Number*</label
                ><input
                  id="pageMobile"
                  name="mobile"
                  type="tel"
                  autocomplete="tel"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageJobTitle">Job Title*</label
                ><input
                  id="pageJobTitle"
                  name="jobTitle"
                  autocomplete="organization-title"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageCompany">Company / Organisation*</label
                ><input
                  id="pageCompany"
                  name="company"
                  autocomplete="organization"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageCountry">Country*</label
                ><input
                  id="pageCountry"
                  name="country"
                  autocomplete="country-name"
                  required
                />
              </div>
              <div class="invitation-form-field">
                <label for="pageOrganisationType">Organisation Type*</label>
                <select
                  id="pageOrganisationType"
                  name="organisationType"
                  required
                >
                  <option value="" selected disabled>Select</option>
                  <option value="enterprise">Enterprise</option>
                  <option value="government">Government</option>
                  <option value="technology-provider">
                    Technology Provider
                  </option>
                  <option value="consulting">Consulting / Advisory</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="invitation-form-field invitation-message-field">
              <label for="pageMessage">Message / Area of Interest</label>
              <textarea
                id="pageMessage"
                name="message"
                rows="3"
                placeholder="Tell us whether you are interested in attending, partnering, sponsorship, speaking, or a private discussion."
              ></textarea>
            </div>
            <label class="invitation-consent" for="pageConsent">
              <input id="pageConsent" name="consent" type="checkbox" required />
              <span
                >I agree to be contacted by Zenith Nexus regarding Workforce
                2030.</span
              >
            </label>
            <p
              class="invitation-form-status"
              id="invitationPageStatus"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <button class="invitation-submit-btn" type="submit">
              SUBMIT INVITATION REQUEST
              <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <p class="invitation-form-note">
              Your information will be used to review your invitation request.
            </p>
          </form>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("invitationPageForm")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          const status = document.getElementById("invitationPageStatus");
          status.textContent =
            "Invitation requests are not connected to a submission service yet.";
          status.hidden = false;
        });
    </script>
  </body>
</html>
